[project]
name = "openprospect-jobs"
version = "0.1.0"
description = "Job & freelance track: fresh remote openings, who to email, AI-written drafts, safe sending."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openprospect-core",
    "openprospect-mail",
    "openprospect-verify",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openprospect"]
