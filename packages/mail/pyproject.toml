[project]
name = "openprospect-mail"
version = "0.1.0"
description = "Email: Listmonk sequences in each lead's business hours, IMAP reply/bounce/opt-out handling, plain SMTP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openprospect-core",
    "openprospect-crm",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openprospect"]
