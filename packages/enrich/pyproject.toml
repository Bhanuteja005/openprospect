[project]
name = "openprospect-enrich"
version = "0.1.0"
description = "Website reader: contact emails, tech stack, budget signals and fixable problems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openprospect-core",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openprospect"]
