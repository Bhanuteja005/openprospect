[project]
name = "openprospect-sources"
version = "0.1.0"
description = "Lead sources: Google Maps (gosom scraper), remote-friendly companies, Reddit buyer intent (Huginn)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openprospect-core",
    "openprospect-crm",
    "requests>=2.32",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openprospect"]
