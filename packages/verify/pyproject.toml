[project]
name = "openprospect-verify"
version = "0.1.0"
description = "Email verification: MX records, Reacher deep checks, chain detection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openprospect-core",
    "requests>=2.32",
    "dnspython>=2.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openprospect"]
