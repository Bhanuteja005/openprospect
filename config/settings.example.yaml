  default_category_points: 8
  tiers:          # total score 0-100
    A: 70         # hot, high-value: email first, call too
    B: 50         # good
    # below B => C (kept in the CRM, emailed last)
  deal_value:     # estimated deal size per tier, shown in the CRM pipeline
    A: 1500
    B: 800
    C: 300
  min_tier_to_email: "C"    # A = only the best, B = A+B, C = everyone with a valid email

# ---------------- Sending (Listmonk) ----------------
sending:
  # New inboxes get blocked fast if they send too much.
  # Week 1: ~20/day, week 2: ~35/day, week 3+: ~50/day per inbox.
  daily_limit: 20
  # Who gets the new-lead slots first (follow-ups always go first).
  # Canada is left out on purpose: CASL generally requires consent before commercial email.
  # Read docs/responsible-use.md before adding it (or any other country).
  country_priority: ["US", "GB", "AU", "NZ", "IE"]
  # Cap some countries per day, e.g. { DE: 3 } = at most 3 new German businesses a day.
  max_new_per_day_by_country: {}
  # Lead sources never emailed by the agency sequence (they still get scored + go to the CRM),
  # e.g. ["remote_companies"] if you only want to pitch local businesses.
  skip_sources: []
  # Warm-up for a new inbox: start low and add a few per day until daily_limit.
  warmup_start_date: ""         # the day this inbox started cold emailing, e.g. "2026-11-01"
  warmup_first_day: 15
  warmup_add_per_day: 5
  # Sequence: step 1 = intro, then follow-ups if no reply.
  followup_after_days: [3, 5]   # step 2 after 3 days, step 3 five days after step 2
  # Emails land in each business's own working hours: weekdays, between these local hours.
  local_send_hours: [9, 16]
  default_timezone: "UTC"
  # false = campaigns are created as DRAFTS in Listmonk; you read them and press Start.
  # true  = fully automatic. Switch on only after you've checked a few drafts.
  auto_send: false
  templates:
    # Subjects: 2-4 words, lowercase, personal. Step 1 uses a per-business subject picked
    # from the main problem found (see packages/scoring copy.py SUBJECTS).
    1: { subject: "{{ .Subscriber.Attribs.subject }}", file: "templates/emails/email_1_intro.html" }
    2: { subject: "one more idea for {{ .Subscriber.Attribs.short }}", file: "templates/emails/email_2_followup.html" }
    3: { subject: "should I close this?", file: "templates/emails/email_3_breakup.html" }

# ---------------- Buyer intent (Huginn) ----------------
intent:
  # The JSON feed URL of the "Buyer intent feed" agent in Huginn.
  # `openprospect setup` fills this in for you.
  huginn_feed_url: ""

# ---------------- Optional free local AI (Ollama) ----------------
# Install Ollama (https://ollama.com), run `ollama pull llama3.2`, set enabled: true.
# The first line of each email is then written by the local model instead of templates.
ai:
  ollama_url: "http://localhost:11434"
  model: "llama3.2"
  enabled: false

# ---------------- Schedule (`openprospect daemon`) ----------------
# When the daemon starts each track, in the machine's local time zone. In the `runner`
# container that is TZ from .env (UTC unless you change it). Keep the quotes.
# Use cron / Task Scheduler instead if you prefer (scripts/schedule-*).
schedule:
  agency_time: "06:00"    # find + email businesses
  jobs_time: "13:00"      # find + email companies that are hiring

# ---------------- Job & freelance track ----------------
# Finds fresh remote openings on public job boards (Hacker News "Who is hiring", Remotive,
# Remote OK, Himalayas, We Work Remotely, Jobicy, Working Nomads), picks who to email,
# has an AI write one email per company from config/profile.md, then sends them.
jobs:
  sender_name: ""             # the From name; empty = agency.sender_name. `jobs send` refuses if both are empty
  max_age_days: 3              # only postings this fresh
  recontact_days: 90           # never email the same company twice within this window
  max_companies_per_day: 30    # no warm-up in this track: keep it at 20-30 on a fresh inbox
  # Titles you want (regular-expression fragments, case-insensitive).
  roles: ["full[- ]?stack", "front[- ]?end", "back[- ]?end", "software (engineer|developer)", "web developer",
          "ai engineer", "ml engineer", "llm", "react", "next\\.?js", "node(\\.js)?", "python", "typescript",
          "product engineer", "founding engineer"]
  # Titles to skip even when a role above matches.
  exclude_roles: ["sales", "account (executive|manager)", "marketing", "designer", "recruiter",
                  "customer (success|support)", "support (engineer|specialist|agent)", "writer", "copywriter",
                  "legal", "counsel", "accountant", "finance", "bookkeep", "data entry", "annotation", "annotator",
                  "trainer", "tutor", "teacher", "nurse", "ios", "android", "embedded", "firmware", "hardware",
                  "mechanical", "electrical", "salesforce", "sap", "qa", "tester", "manual test", "devops", "sre",
                  "site reliability", "data engineer", "analytics", "data analyst", "security engineer",
                  "cloud (infrastructure|engineer)", "network", "solutions engineer", "director", "vp", "manager"]
  # Your skills: each match in a posting raises its fit score.
  stack: ["react", "next.js", "nextjs", "typescript", "javascript", "node", "python", "fastapi", "django",
          "flask", "llm", "openai", "gpt", "claude", "langchain", "langgraph", "rag", "agent", "ai",
          "full-stack", "full stack", "fullstack", "postgres", "mongodb", "aws", "docker", "voice",
          "automation", "tailwind", "saas"]
  # Location words that mean "open to you". Add your own country / region / time zone words,
  # e.g. india, apac, ist, latam, europe.
  open_to: ["worldwide", "anywhere", "global", "remote (global)", "all countries", "any location"]
  # Regions that exclude you: postings limited to these (and not also open_to) are skipped.
  # Remove the ones you live in.
  blocked_regions: ["us", "u.s.", "usa", "united states", "canada", "north america", "americas", "amer",
                    "latam", "brazil", "mexico", "europe", "european", "eu", "emea", "cet", "cest", "gmt",
                    "uk", "germany", "poland", "romania", "spain", "france", "ireland", "netherlands",
                    "portugal", "residents", "select countries", "eastern", "central", "pacific", "est", "pst"]
  # The AI writer (Claude Code in headless mode by default). It reads prompts/job-outreach.md.
  # It reads untrusted job posts and web pages, so its tools are limited: it can read and research,
  # and it can only write inside data/jobs/.
  writer:
    command: "claude"
    allowed_tools: ["Read", "Glob", "Grep", "WebFetch", "WebSearch", "Write(data/jobs/**)"]
    timeout_minutes: 60        # stop the writer if it runs longer than this
