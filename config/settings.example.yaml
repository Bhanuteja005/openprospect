# ============================================================
#  OpenProspect settings
#
#  `openprospect init` copies this file to config/settings.yaml (git-ignored).
#  Edit config/settings.yaml, never this example.
# ============================================================

# ---------------- Who you are ----------------
agency:
  name: ""                           # your agency / studio / brand, e.g. "Rivera Studio"
  sender_name: ""                    # who the email is from, e.g. "Alex Rivera"
  intro: ""                          # one sentence after the first line of email 1 ([[SENDER_INTRO]]),
                                     # e.g. "I'm Alex, a web developer." `doctor` flags it while empty
  website: ""                        # e.g. "https://yourstudio.com" (shown as plain text in emails)
  # A physical postal address in every cold email is REQUIRED by US law (CAN-SPAM) and expected
  # in most countries. Nothing is sent until this is set.
  postal_address: ""                 # e.g. "123 Main St, Suite 4, Austin, TX 78701, USA"
  calendar_link: ""                  # optional, e.g. a free Cal.com / Calendly link
  currency: "USD"                    # deal values in the CRM
  phone_country: "US"                # default country for local phone numbers (ISO code)
  phone_calling_code: "+1"           # its dialling code

# What you sell, one full sentence per problem found on a lead's website.
# It follows your intro line in email 1. Write these in your own words.
offers:
  no_website:       "I build simple, fast websites for local businesses that turn Google searches into calls and bookings."
  site_down:        "I can get it back online quickly and make sure it stays up."
  bad_ssl:          "It's usually a quick fix, and I can sort it out for you."
  no_https:         "It's a quick fix, and I can sort it out for you."
  ssl_expiring:     "Renewing it and setting it to auto-renew is a quick fix, and I can do it for you."
  old_tls:          "It's a server setting I can update quickly, without any downtime."
  outdated_wordpress: "I can update it safely and fix anything that breaks, or move you to a faster, modern site."
  old_php:          "I can move the site to a current, supported setup without any downtime."
  old_jquery:       "It's a small update, and I can do it as part of a quick security tune-up."
  no_https_redirect: "It's a 10-minute fix, and I can sort it out for you."
  mixed_content:    "It's usually a quick fix, and I can clean it up for you."
  not_mobile:       "I build mobile-friendly sites that turn phone visitors into calls and bookings."
  slow_site:        "I make sites load in under 2 seconds so visitors stay and book."
  outdated_site:    "I build modern, fast websites for local businesses that bring in more calls and bookings."
  no_booking:       "I set up online booking with instant auto-replies, so enquiries come in 24/7."
  no_analytics:     "I set up simple tracking and lead capture so you can see exactly what brings in customers."
  low_rating:       "I set up an automatic review-request system that steadily lifts your Google rating."
  default:          "I build fast websites and custom web apps for growing businesses, from online booking to customer portals."

# ---------------- Lead scraping (Google Maps) ----------------
scrape:
  image: "gosom/google-maps-scraper"   # Docker image; pin a tag here if you want reproducible runs
  depth: 2            # how far to scroll each search (1 = ~20 results, 10 = ~120+)
  concurrency: 1      # parallel browser jobs. Keep low on small machines (4 GB Docker)
  extract_emails: true
  language: "en"
  exit_on_inactivity: "3m"
  max_queries_per_run: 15  # roughly an hour of scraping
  # When config/queries.txt runs out, new searches are generated automatically:
  # every niche x every city, rotating through countries. Add niches or cities any time.
  auto_queries:
    enabled: true
    weights: { US: 2 }    # picks per round per country (others get 1)
    niches: ["dentist", "cosmetic dentist", "orthodontist", "med spa", "plastic surgeon", "dermatologist",
             "chiropractor", "physical therapy clinic", "personal injury lawyer", "family law attorney",
             "real estate agent", "roofing contractor", "HVAC company", "plumber", "electrician",
             "landscaping company", "home builder", "interior designer", "CPA firm", "veterinary clinic",
             "fertility clinic", "hair transplant clinic", "wedding venue", "boutique hotel", "car dealership"]
    cities:
      US: ["Austin TX", "Dallas TX", "Houston TX", "San Antonio TX", "Phoenix AZ", "Scottsdale AZ", "Denver CO",
           "Nashville TN", "Charlotte NC", "Raleigh NC", "Atlanta GA", "Tampa FL", "Orlando FL", "Miami FL",
           "Columbus OH", "Indianapolis IN", "Kansas City MO", "Salt Lake City UT", "Boise ID", "Las Vegas NV",
           "San Diego CA", "Sacramento CA", "Seattle WA", "Portland OR", "Chicago IL", "Minneapolis MN"]
      GB: ["London UK", "Manchester UK", "Birmingham UK", "Leeds UK", "Bristol UK", "Glasgow UK",
           "Edinburgh UK", "Liverpool UK", "Sheffield UK", "Nottingham UK", "Cardiff UK", "Newcastle UK"]
      AU: ["Sydney Australia", "Melbourne Australia", "Brisbane Australia", "Perth Australia",
           "Adelaide Australia", "Gold Coast Australia", "Canberra Australia"]

# ---------------- Remote-friendly companies ----------------
# B2B leads from github.com/remoteintech/remote-jobs (cloned into data/cache/ on first use).
remote_companies:
  company_sizes: ["tiny", "small"]   # small firms buy outside help; add "medium" for more
  technologies_any: []               # e.g. ["wordpress", "shopify", "php"]. Empty = all
  limit_per_run: 50                  # new companies per run

# ---------------- Website enrichment ----------------
enrich:
  max_pages_per_site: 4         # homepage + contact/about pages
  timeout_seconds: 15
  slow_site_seconds: 4.0        # slower than this => "slow_site"
  outdated_year_before: 2023    # (c) year older than this => "outdated_site"
  per_run_limit: 700

# ---------------- Email verification ----------------
verify:
  # Statuses allowed to receive email:
  #   safe        - Reacher confirmed the inbox exists
  #   risky       - catch-all / full inbox (Reacher)
  #   site_mx_ok  - published on the business's own website and its mail server exists
  #                 (the fallback when port 25 is blocked and Reacher can't check)
  sendable_statuses: ["safe", "site_mx_ok"]
  # Guess info@ / contact@ when none was found. Only kept if Reacher says "safe".
  guess_role_emails: true
  per_run_limit: 200
  # Big chains: kept in the CRM, never emailed (head-office inboxes don't hire from cold email).
  # Any website shared by 3+ listings is also treated as a chain automatically.
  # Add the chains of your own market.
  skip_chains: ["aspen dental", "heartland dental", "smile direct", "bupa", "mydentist", "specsavers",
                "regus", "keller williams", "re/max", "coldwell banker", "century 21", "kumon",
                "orangetheory", "anytime fitness", "planet fitness", "great clips", "supercuts",
                "banfield", "vca animal", "jiffy lube", "midas", "starbucks", "mcdonald"]

