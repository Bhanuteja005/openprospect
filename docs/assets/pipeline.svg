<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">How OpenProspect works</title>
  <desc id="d">Two daily tracks. Find clients: Google Maps, remote-friendly companies and Reddit buyer intent flow into website enrichment, email verification and scoring, then into Twenty CRM and a Listmonk email sequence; replies, opt-outs and bounces flow back. Find work: job boards are filtered by role and location, recipients are found under strict rules, Claude Code writes each email, and they are sent safely.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: .08em; fill: #94a3b8; }
      .h { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .s { font-size: 12px; fill: #cbd5e1; }
      .tag { font-size: 11px; fill: #94a3b8; }
      .line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#a); }
      .loop { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#a); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="22" fill="#0b1220"/>

  <!-- ===== Lane 1: find clients ===== -->
  <text x="36" y="44" class="lane">TRACK 1 · FIND CLIENTS   (openprospect run)</text>

  <!-- sources -->
  <g>
    <rect x="36" y="66" width="190" height="186" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="56" y="94" class="h">Sources</text>
    <text x="56" y="122" class="s">Google Maps businesses</text>
    <text x="56" y="140" class="tag">gosom/google-maps-scraper</text>
    <text x="56" y="168" class="s">Remote-friendly companies</text>
    <text x="56" y="186" class="tag">remoteintech/remote-jobs</text>
    <text x="56" y="214" class="s">Reddit "hiring" posts</text>
    <text x="56" y="232" class="tag">Huginn</text>
  </g>

  <g>
    <rect x="262" y="104" width="160" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="282" y="132" class="h">Enrich</text>
    <text x="282" y="156" class="s">read their website:</text>
    <text x="282" y="174" class="s">emails, problems,</text>
    <text x="282" y="192" class="s">budget signals</text>
  </g>

  <g>
    <rect x="458" y="104" width="160" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="478" y="132" class="h">Verify</text>
    <text x="478" y="156" class="s">MX + Reacher</text>
    <text x="478" y="174" class="s">no guesses, no</text>
    <text x="478" y="192" class="s">big chains</text>
  </g>

  <g>
    <rect x="654" y="104" width="160" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="674" y="132" class="h">Score</text>
    <text x="674" y="156" class="s">0–100, Tier A/B/C</text>
    <text x="674" y="174" class="s">+ a personal first</text>
    <text x="674" y="192" class="s">line per business</text>
  </g>

  <g>
    <rect x="850" y="66" width="314" height="80" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="870" y="94" class="h">CRM · Twenty</text>
    <text x="870" y="118" class="s">company, contact, deal value, insight note</text>
    <text x="870" y="134" class="tag">your sales board</text>
  </g>
  <g>
    <rect x="850" y="172" width="314" height="80" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="870" y="200" class="h">Send · Listmonk</text>
    <text x="870" y="224" class="s">intro + 2 follow-ups, in their business hours</text>
    <text x="870" y="240" class="tag">your own inbox, warm-up aware</text>
  </g>

  <path d="M226 159 H256" class="line"/>
  <path d="M422 159 H452" class="line"/>
  <path d="M618 159 H648" class="line"/>
  <path d="M814 150 L844 112" class="line"/>
  <path d="M814 168 L844 206" class="line"/>

  <!-- replies loop -->
  <path d="M1007 252 V292 H460 V226" class="loop"/>
  <text x="480" y="284" class="s" fill="#fbbf24" style="fill:#fbbf24">replies → deal moves to SCREENING · opt-outs + bounces → never emailed again</text>

  <!-- divider -->
  <line x1="36" y1="322" x2="1164" y2="322" stroke="#1f2a3d" stroke-width="2"/>

  <!-- ===== Lane 2: find work ===== -->
  <text x="36" y="360" class="lane">TRACK 2 · FIND WORK   (openprospect jobs daily)</text>

  <g>
    <rect x="36" y="382" width="190" height="130" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="56" y="410" class="h">Job boards</text>
    <text x="56" y="436" class="s">HN Who is hiring,</text>
    <text x="56" y="454" class="s">Remotive, Remote OK,</text>
    <text x="56" y="472" class="s">Himalayas, WWR, …</text>
    <text x="56" y="496" class="tag">postings ≤ 3 days old</text>
  </g>

  <g>
    <rect x="262" y="392" width="200" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="282" y="420" class="h">Fit filter</text>
    <text x="282" y="444" class="s">your roles + stack,</text>
    <text x="282" y="462" class="s">open to where you live</text>
    <text x="282" y="486" class="tag">jobs: in settings.yaml</text>
  </g>

  <g>
    <rect x="498" y="392" width="200" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="518" y="420" class="h">Who to email</text>
    <text x="518" y="444" class="s">hiring people, careers@,</text>
    <text x="518" y="462" class="s">hello@ · never support@</text>
    <text x="518" y="486" class="tag">published addresses only</text>
  </g>

  <g>
    <rect x="734" y="392" width="200" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="754" y="420" class="h">AI writes</text>
    <text x="754" y="444" class="s">one email per company</text>
    <text x="754" y="462" class="s">from your profile.md</text>
    <text x="754" y="486" class="tag">Claude Code, headless</text>
  </g>

  <g>
    <rect x="970" y="392" width="194" height="110" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="990" y="420" class="h">Safe send</text>
    <text x="990" y="444" class="s">re-checks every rule,</text>
    <text x="990" y="462" class="s">once per company</text>
    <text x="990" y="486" class="tag">per 90 days</text>
  </g>

  <path d="M226 447 H256" class="line"/>
  <path d="M462 447 H492" class="line"/>
  <path d="M698 447 H728" class="line"/>
  <path d="M934 447 H964" class="line"/>
</svg>
